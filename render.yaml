services:
  - type: web
    name: vyapar-billing
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true